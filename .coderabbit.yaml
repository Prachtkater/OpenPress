# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
tone_instructions: "Constructive and pragmatic. Focus on improvements, not criticism."
early_access: false

reviews:
  profile: chill
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  poem: false
  suggested_labels: false
  suggested_reviewers: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"

  path_filters:
    - "!**/*.lock"
    - "!**/bun.lockb"
    - "!**/dist/**"
    - "!**/.nuxt/**"
    - "!**/.output/**"
    - "!**/node_modules/**"

  path_instructions:
    - path: "packages/core/**"
      instructions: >
        Core Nuxt Module - pay attention to Nuxt conventions, TypeScript strictness,
        correct module hooks and runtime-server compatibility.
    - path: "packages/schemas/**"
      instructions: >
        Schema definitions - follow Zod best practices, use z.output<> over z.infer<>,
        ZodType<T, any, any> for generic parameters, and ensure type safety.
    - path: "packages/poc-*/**"
      instructions: >
        POC packages - focus on feasibility and concept validation.
        Code quality is secondary, functionality is primary.
    - path: "packages/theme-*/**"
      instructions: >
        Themes - verify strict separation of logic and visuals.
        Themes must not contain business logic.
    - path: "packages/feature-*/**"
      instructions: >
        Features - adhere to feature manifest conventions.
        Every feature must export a manifest.ts.
    - path: "packages/ui/**"
      instructions: >
        UI components - Glow-Frame conventions, theme engine compatibility,
        slot-based architecture verification.
    - path: "playground/**"
      instructions: >
        Playground - Nuxt development environment for demos and tests.
        Don't enforce production-relevant patterns here.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: true

  tools:
    eslint:
      enabled: true
    biome:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    actionlint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto

code_generation:
  docstrings:
    language: en-US
  unit_tests:
    path_instructions:
      - path: "packages/**"
        instructions: >
          Tests with Bun test runner (bun:test).
          Use describe/it/expect pattern.
          Mock modules with mock.module() when necessary.
